<main>
    <h1>Interactive Photo Gallery</h1>

    <div id="image" role="status" aria-live="polite">
        Hover over an image below to display here.
    </div>

    <div class="gallery">
        <img class="preview"
             src="https://images.unsplash.com/photo-1552053831-71594a27632d?w=600"
             alt="A golden retriever sitting outdoors"
             onmouseover="upDate(this)"
             onmouseleave="unDo()"
             onfocus="upDate(this)"
             onblur="unDo()">

        <img class="preview"
             src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=600"
             alt="A dog looking toward the camera"
             onmouseover="upDate(this)"
             onmouseleave="unDo()"
             onfocus="upDate(this)"
             onblur="unDo()">

        <img class="preview"
             src="https://images.unsplash.com/photo-1551717743-49959800b1f6?w=600"
             alt="A dog playing outdoors"
             onmouseover="upDate(this)"
             onmouseleave="unDo()"
             onfocus="upDate(this)"
             onblur="unDo()">

        <img class="preview"
             src="https://images.unsplash.com/photo-1517849845537-4d257902454a?w=600"
             alt="A small dog sitting outside"
             onmouseover="upDate(this)"
             onmouseleave="unDo()"
             onfocus="upDate(this)"
             onblur="unDo()">

        <img class="preview"
             src="https://images.unsplash.com/photo-1587300003388-59208cc962cb?w=600"
             alt="A happy dog with its mouth open"
             onmouseover="upDate(this)"
             onmouseleave="unDo()"
             onfocus="upDate(this)"
             onblur="unDo()">

        <img class="preview"
             src="https://images.unsplash.com/photo-1537151625747-768eb6cf92b2?w=600"
             alt="A dog standing on the ground"
             onmouseover="upDate(this)"
             onmouseleave="unDo()"
             onfocus="upDate(this)"
             onblur="unDo()">
    </div>
</main>
